packages:
  - 'projects/*'
  - 'projects/*/server'
  - 'projects/*/web'
  - 'projects/*/e2e'
allowBuilds:
  '@nestjs/core': false
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - zustand@5.0.14
# Security overrides (Dependabot alerts). All are dev/build-time or transitive —
# none reach the deployed production images. Patched versions pinned repo-wide.
overrides:
  vitest: '^4.1.0' # CVE: Vitest UI server arbitrary file read/exec (<4.1.0)
  vite: '^6.4.2' # path traversal in optimized-deps .map handling
  esbuild: '^0.25.0' # dev server cross-origin request/response read
  postcss: '^8.5.10' # XSS via unescaped </style> in stringify
  tmp: '^0.2.6' # path traversal via unsanitized prefix/postfix
  uuid: '^11.1.1' # missing buffer bounds check (v3/v5/v6 with buf)
