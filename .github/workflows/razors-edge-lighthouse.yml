name: razors-edge-lighthouse

# Phase 6, Task 6.3 — Lighthouse CI for razors-edge.
#
# Audits the BUILT + SERVED production surface on :3070 (NOT next dev — the
# strict CSP forbids unsafe-eval and next dev cannot run under it, the meld
# lesson carried in razors-edge AGENT_NOTES). Asserts the success criteria
# from PLAN.md / CLAUDE.md § 4: >= 95 in all four categories on the hero (/)
# and the booking flow (/book), median of 5 runs, plus the hero Core Web
# Vitals (LCP < 2.5s, CLS < 0.1). Config + assertions live in
# projects/razors-edge/lighthouserc.json; LHCI starts the server itself via
# `startServerCommand`.
#
# Trigger model (mirrors meld-e2e):
#   - push to main touching projects/razors-edge/** — gate the project on
#     every change.
#   - workflow_dispatch — manual run on demand.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'projects/razors-edge/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/razors-edge-lighthouse.yml'

concurrency:
  group: razors-edge-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (>= 95 all categories, /, /book)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build razors-edge-web
        run: pnpm -F razors-edge-web build

      - name: Run Lighthouse CI
        run: |
          npx --yes @lhci/cli@0.15.x autorun \
            --config=projects/razors-edge/lighthouserc.json
        env:
          # LHCI uploads to temporary public storage; no token needed.
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: razors-edge-lighthouse-${{ github.run_id }}
          path: .lighthouseci
          retention-days: 30
