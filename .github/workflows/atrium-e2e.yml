name: atrium-e2e

# Phase 6, Task 6.2 — Playwright E2E harness for atrium.
#
# Critical-path coverage for the portfolio's scroll-driven lobby: the landing
# SSR / production-CSP smoke, the twelve outward affordances (six live demo
# links + six U2 disabled repo controls), the reduced-motion static-directory
# path (no pin, nothing frozen), the theme toggle in both themes, full keyboard
# reachability of the twelve affordances, the no-JS directory render, and the
# SEO surface (robots / sitemap / OG image / JSON-LD).
#
# The surface under test is the BUILT + SERVED app on :3080 (next start, NOT
# next dev — the strict CSP forbids unsafe-eval and next dev cannot run under
# it; several assertions, e.g. zero CSP violations + GSAP-hydrated descent, are
# only meaningful against the production surface).
#
# Trigger model (mirrors razors-edge-e2e):
#   - workflow_dispatch with an optional target_url — run against any deployed
#     URL (a pre-promotion gate). Defaults to the in-job local stack.
#   - push to main touching projects/atrium/** — gate the project on a passing
#     E2E sweep against the in-job built + served app.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to test against (defaults to the in-job local build)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'projects/atrium/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/atrium-e2e.yml'

concurrency:
  group: atrium-e2e-${{ github.event.inputs.target_url || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  e2e:
    name: e2e (built + served :3080)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # When a target_url is supplied (dispatch), test that; otherwise the
      # in-job local build on :3080.
      ATRIUM_E2E_TARGET_URL: ${{ github.event.inputs.target_url }}
      BASE_URL: ${{ github.event.inputs.target_url || 'http://localhost:3080' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium only)
        run: pnpm -F atrium-e2e exec playwright install --with-deps chromium

      - name: Build atrium-web
        if: github.event.inputs.target_url == ''
        run: pnpm -F atrium-web build

      - name: Start atrium-web (next start on :3080)
        if: github.event.inputs.target_url == ''
        run: |
          nohup pnpm -F atrium-web start > /tmp/atrium-web.log 2>&1 &
          echo "ATRIUM_WEB_PID=$!" >> $GITHUB_ENV

      - name: Wait for the app on :3080
        if: github.event.inputs.target_url == ''
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3080 > /dev/null; then
              echo "atrium-web up"
              exit 0
            fi
            sleep 1
          done
          echo "atrium-web never came up. Last log:"
          tail -n 200 /tmp/atrium-web.log || true
          exit 1

      - name: Run Playwright tests
        run: pnpm -F atrium-e2e test --project=chromium

      - name: Stop background process
        if: always() && github.event.inputs.target_url == ''
        run: |
          if [ -n "${ATRIUM_WEB_PID:-}" ]; then kill "$ATRIUM_WEB_PID" || true; fi

      - name: Upload web log on failure
        if: failure() && github.event.inputs.target_url == ''
        uses: actions/upload-artifact@v4
        with:
          name: atrium-web-log-${{ github.run_id }}
          path: /tmp/atrium-web.log
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atrium-e2e-report-${{ github.run_id }}
          path: projects/atrium/e2e/playwright-report
          retention-days: 30
