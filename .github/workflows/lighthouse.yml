# Manually triggered Lighthouse audit against a deployed URL (preview or production).
# Run from the Actions tab with a URL input once a project has a live deploy.
# Per-PR auditing is not wired up here — preview deploys are project-specific (Vercel, Netlify, etc.)
# and should be added per project when the deploy lives.

name: Lighthouse

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to audit (must be reachable)
        required: true
        type: string

jobs:
  audit:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ github.event.inputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse-budget.json
