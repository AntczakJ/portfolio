# fly.toml app configuration file generated for tape-demo on 2026-05-31T03:00:06+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tape-demo'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  ALLOWED_ORIGINS = 'https://tape-demo.fly.dev'
  BINANCE_SYMBOL = 'btcusdt'
  BINANCE_WS_ENABLED = '0'
  BINANCE_WS_URL = 'wss://fstream.binance.com/ws'
  BRIDGE_PATH = '/tmp/tape-bridge.sock'
  BRIDGE_WORKER_BIN = '/app/worker/worker'
  NODE_ENV = 'production'
  PORT = '3001'
  WEB_PORT = '3000'
  # Run the Rust worker pipeline so the board produces footprint CELLS (not just
  # ticks). With WS_SYNTHESIZE=1 + BINANCE_WS_ENABLED=0 the synth ticks feed the
  # worker over the bridge and the worker is the single cell authority — real
  # footprint cells without a reachable Binance feed (the offline fallback), and
  # the cells persist to Postgres so replay has data.
  WORKER_PIPELINE_ENABLED = '1'
  WS_MAX_CONNECTIONS_PER_IP = '5'
  WS_SYNTHESIZE = '1'

[http_service]
  # All external HTTPS traffic terminates at the Elysia server on 3001.
  # Server obsługuje /health and /ws/stream natively; everything else
  # (including the Next.js page tree) is proxied to localhost:3000 by
  # the catch-all route in server.ts. This avoids the dual-services
  # collision Fly's edge proxy hits when two services share port 443.
  internal_port = 3001
  force_https = true
  # Keep the machine warm — chart needs a live WS connection and a
  # stopped machine drops it. Demo URL recruiters expect to load
  # without a 5-10 s cold-start delay (the "5-second wow moment"
  # window from PLAN.md).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '60s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # 1024 MB: the runtime machine runs THREE processes at once — the Bun/Elysia
  # server (DI + WS broadcast + the dedicated bridge connection + the per-scope
  # ring buffer), the Rust worker (probe/aggregate, concurrency-bound buffers),
  # and the Next standalone server (which the Elysia catch-all reverse-proxies
  # the whole frontend through). The razors-edge/pulse lesson (Next OOM'd at 256)
  # plus two extra runtimes here put the safe floor at 1024; 512 risks an OOM on
  # the first asset-optimization + WS burst. Drop to 512 only if metrics prove headroom.
  memory_mb = 1024
