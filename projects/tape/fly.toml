# fly.toml app configuration file generated for tape-demo on 2026-05-31T03:00:06+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tape-demo'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  ALLOWED_ORIGINS = 'https://tape-demo.fly.dev'
  BINANCE_SYMBOL = 'btcusdt'
  BINANCE_WS_ENABLED = '1'
  BINANCE_WS_URL = 'wss://fstream.binance.com/ws'
  BRIDGE_PATH = '/tmp/tape-bridge.sock'
  BRIDGE_WORKER_BIN = '/app/worker/worker'
  NODE_ENV = 'production'
  PORT = '3001'
  WEB_PORT = '3000'
  WORKER_PIPELINE_ENABLED = '0'
  WS_MAX_CONNECTIONS_PER_IP = '5'
  WS_SYNTHESIZE = '0'

[http_service]
  # All external HTTPS traffic terminates at the Elysia server on 3001.
  # Server obsługuje /health and /ws/stream natively; everything else
  # (including the Next.js page tree) is proxied to localhost:3000 by
  # the catch-all route in server.ts. This avoids the dual-services
  # collision Fly's edge proxy hits when two services share port 443.
  internal_port = 3001
  force_https = true
  # Keep the machine warm — chart needs a live WS connection and a
  # stopped machine drops it. Demo URL recruiters expect to load
  # without a 5-10 s cold-start delay (the "5-second wow moment"
  # window from PLAN.md).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
