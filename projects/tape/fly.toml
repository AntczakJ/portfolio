# fly.toml app configuration file generated for tape-demo on 2026-05-31T03:00:06+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tape-demo'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  ALLOWED_ORIGINS = 'https://tape-demo.fly.dev'
  BINANCE_SYMBOL = 'btcusdt'
  BINANCE_WS_ENABLED = '1'
  BINANCE_WS_URL = 'wss://fstream.binance.com/ws'
  BRIDGE_PATH = '/tmp/tape-bridge.sock'
  BRIDGE_WORKER_BIN = '/app/worker/worker'
  NODE_ENV = 'production'
  PORT = '3001'
  WEB_PORT = '3000'
  WORKER_PIPELINE_ENABLED = '0'
  WS_MAX_CONNECTIONS_PER_IP = '5'
  WS_SYNTHESIZE = '0'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[[services]]
  protocol = 'tcp'
  internal_port = 3001
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']
    force_https = true

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [services.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
