# fly.toml for nocturne-demo
#
# NOTE: the app is `nocturne-demo` (the bare `nocturne` may be taken on Fly, as
# `atrium` was). If you redeploy under another name, update BOTH the `app =`
# line AND every NEXT_PUBLIC_SITE_URL (the Dockerfile ARG default + the [env]
# mirror) — every absolute URL (canonical, OG, sitemap, robots, JSON-LD) is
# built from it. See DEPLOY.md.
#
# nocturne's deploy posture (ADR-001 web-only, ADR-005):
#   - WEB-ONLY: a single Fly Machine running ONE process, the Next standalone
#     Node server. The GPU particle field + Web Audio run CLIENT-SIDE in the
#     visitor's browser; the server just serves the bundle. No backend, no DB,
#     no secrets.
#   - 443 -> Fly edge TLS -> container :3000 (conventional Next standalone PORT).
#   - Region `fra` (EU), matching the siblings.
#   - COST-FIRST scaling (the atrium posture): auto_stop_machines = 'stop' +
#     min_machines_running = 0 -> the stateless app scales fully to zero when
#     idle (~$0 compute) and auto-starts on the first request (a one-time cold
#     start). The WebGL wow runs on the visitor's GPU regardless of the Machine
#     size, so a warm floor buys nothing here. Bump min to 1 if the cold start
#     ever matters more than the bill.

app = 'nocturne-demo'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  # Baked at BUILD time in the Dockerfile (Next inlines NEXT_PUBLIC_*); mirrored
  # here as defence-in-depth + an audit signal. Keep in sync with the ARG.
  NEXT_PUBLIC_SITE_URL = 'https://nocturne-demo.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'get'
    path = '/'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # 512 MB. The server is light (it serves a bundle; the heavy three.js + GPGPU
  # run in the BROWSER). The only server-side memory pressure is the dynamic OG
  # ImageResponse (satori) render — the razors-edge 256MB OOM precedent — so we
  # start at 512. At scale-to-zero this costs nothing at idle.
  memory_mb = 512
